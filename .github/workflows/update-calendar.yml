name: WebUntis Kalender aktualisieren

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js installieren
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Stundenplan abrufen und iCal erzeugen
        env:
          WEBUNTIS_SERVER: "elgym.webuntis.com"
          WEBUNTIS_SCHOOL: ${{ secrets.WEBUNTIS_SCHOOL }}
          WEBUNTIS_USERNAME: ${{ secrets.WEBUNTIS_USERNAME }}
          WEBUNTIS_PASSWORD: ${{ secrets.WEBUNTIS_PASSWORD }}
          OUTPUT_FILE: "stundenplan.ics"
          CALENDAR_NAME: "WebUntis Stundenplan"
          DAYS_PAST: "14"
          DAYS_FUTURE: "120"
        run: npm run generate

      - name: Prüfen ob Datei existiert
        run: |
          ls -lah

      - name: In GitHub speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden"
            exit 0
          fi

          git commit -m "WebUntis Kalender aktualisiert"
          git push
